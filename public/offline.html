<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2a4a" />
  <title>Offline · Working For God Ventures</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .card { width: 100%; max-width: 360px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.5; }
    button { margin-top: 24px; width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600;
      color: #fff; background: #1f74b0; cursor: pointer; }
    button:active { background: #1a5c8e; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="" />
    <h1>You're offline</h1>
    <p>Working For God Ventures needs an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
